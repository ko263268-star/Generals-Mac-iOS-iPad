workflows:
  ios-vulkan:
    name: Generals iOS Vulkan
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      xcode: latest
      vars:
        VCPKG_FORCE_SYSTEM_BINARIES: "1"
        VCPKG_FEATURE_FLAGS: "versions,manifests"
        VCPKG_DEFAULT_TRIPLET: "arm64-ios"
        VCPKG_OSX_SYSROOT: "iphoneos"

    scripts:

      - name: Install build tools
        script: |
          brew update
          brew install cmake ninja xcodegen

      - name: Install vcpkg
        script: |
          if [ ! -d "$HOME/vcpkg" ]; then
            git clone https://github.com/microsoft/vcpkg.git "$HOME/vcpkg"
          fi
          "$HOME/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo 'export VCPKG_ROOT=$HOME/vcpkg' >> $CM_BUILD_DIR/env_vars.sh

      - name: Install LunarG Vulkan SDK
        script: |
          brew install vulkan-tools vulkan-loader

      - name: Initialize submodules
        script: |
          git submodule update --init --recursive

      - name: Fetch MoltenVK runtime
        script: |
          chmod +x scripts/build/ios/fetch-moltenvk.sh
          ./scripts/build/ios/fetch-moltenvk.sh

      - name: Stage fonts
        script: |
          chmod +x scripts/build/ios/stage-fonts.sh
          ./scripts/build/ios/stage-fonts.sh

      - name: Configure clean iOS build
        script: |
          rm -rf build/ios-vulkan
          cmake --preset ios-vulkan

      - name: Verify vcpkg iOS libraries
        script: |
          echo "Checking iOS dependencies..."
          test -d build/ios-vulkan
          echo "iOS build directory OK"

      - name: Build Generals
        script: |
          cmake --build build/ios-vulkan --config Release --parallel

      - name: Package iOS IPA
        script: |
          chmod +x scripts/build/ios/package-ios-zh.sh
          ./scripts/build/ios/package-ios-zh.sh

      - name: Verify IPA
        script: |
          echo "Searching for IPA..."
          IPA=$(find . -type f -name "*.ipa" | head -n 1)

          if [ -z "$IPA" ]; then
            echo "ERROR: IPA was not created."
            exit 1
          fi

          echo "IPA found:"
          echo "$IPA"

    artifacts:
      - "**/*.ipa"
      - "**/*.xcarchive"
