workflows:
  ios-vulkan:
    name: Generals iOS Vulkan
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      xcode: latest

    scripts:
      - name: Install build tools
        script: |
          brew install cmake ninja meson pkgconf xcodegen glslang

      - name: Install vcpkg
        script: |
          git clone https://github.com/microsoft/vcpkg.git "$HOME/vcpkg"
          "$HOME/vcpkg/bootstrap-vcpkg.sh"
          export VCPKG_ROOT="$HOME/vcpkg"

      - name: Install LunarG Vulkan SDK
        script: |
          SDK_VERSION="1.4.363.0"
          SDK_ROOT="$HOME/VulkanSDK"

          curl -fL \
            "https://sdk.lunarg.com/sdk/download/${SDK_VERSION}/mac/vulkansdk-macos-${SDK_VERSION}.zip" \
            -o /tmp/vulkan-sdk.zip

          unzip -q /tmp/vulkan-sdk.zip -d /tmp/vulkan-sdk

          INSTALLER=$(find /tmp/vulkan-sdk -path "*/Contents/MacOS/*" -type f | head -1)

          chmod +x "$INSTALLER"

          "$INSTALLER" \
            --root "$SDK_ROOT" \
            --accept-licenses \
            --default-answer \
            --confirm-command \
            install

          export VULKAN_SDK="$SDK_ROOT/macOS"

          echo "VULKAN_SDK=$VULKAN_SDK"

          test -f "$VULKAN_SDK/lib/MoltenVK.xcframework/ios-arm64/libMoltenVK.a"

      - name: Initialize submodules
        script: |
          git submodule update --init --recursive

      - name: Fetch MoltenVK runtime
        script: |
          ./scripts/build/ios/fetch-moltenvk.sh

      - name: Stage fonts
        script: |
          ./scripts/build/ios/stage-fonts.sh

      - name: Configure
        script: |
          export VCPKG_ROOT="$HOME/vcpkg"
          export VULKAN_SDK="$HOME/VulkanSDK/macOS"
          cmake --preset ios-vulkan

      - name: Build
        script: |
          export VCPKG_ROOT="$HOME/vcpkg"
          export VULKAN_SDK="$HOME/VulkanSDK/macOS"
          cmake --build build/ios-vulkan --config RelWithDebInfo --target z_generals

      - name: Package
        script: |
          ./scripts/build/ios/package-ios-zh.sh

    artifacts:
      - "**/*.ipa"
