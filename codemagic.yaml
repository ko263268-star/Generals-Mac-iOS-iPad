workflows:
  ios-vulkan:
    name: Generals iOS Vulkan
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      xcode: latest
      vars:
        VCPKG_FORCE_SYSTEM_BINARIES: "1"
        VCPKG_FEATURE_FLAGS: "versions,manifests"
        VCPKG_DEFAULT_TRIPLET: "arm64-ios"
        VCPKG_OSX_SYSROOT: "iphoneos"

    scripts:
      - name: Initialize submodules
        script: |
          git submodule update --init --recursive

      - name: Fetch MoltenVK
        script: |
          chmod +x scripts/build/ios/fetch-moltenvk.sh
          ./scripts/build/ios/fetch-moltenvk.sh

      - name: Stage fonts
        script: |
          chmod +x scripts/build/ios/stage-fonts.sh
          ./scripts/build/ios/stage-fonts.sh

      - name: Configure iOS Vulkan
        script: |
          cmake --preset ios-vulkan

      - name: Build
        script: |
          cmake --build build/ios-vulkan --config Release --parallel

      - name: Package IPA
        script: |
          chmod +x scripts/build/ios/package-ios-zh.sh
          ./scripts/build/ios/package-ios-zh.sh

    artifacts:
      - build/ios-vulkan/**/*.ipa
      - build/ios-vulkan/**/*.app
